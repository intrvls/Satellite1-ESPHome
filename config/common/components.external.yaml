substitutions:
  ext_comp_repo_url: https://github.com/intrvls/Satellite1-ESPHome
  ext_comp_repo_ref: v0.2.0-intrvls.1

external_components:
  - source:
      type: git
      url: ${ext_comp_repo_url}
      ref: ${ext_comp_repo_ref}
    refresh: 1s
    components:
      - fusb302b
      - i2s_audio
      - led_ring_controller
      - memory_flasher
      - pcm5122
      - satellite1
      - satellite1_radar
      - tas2780
      # Vendored from ESPHome 2026.4.5 to carry a local patch holding the media player in the
      # ANNOUNCING state until the TTS/announcement PCM drains from the speaker chain, so device
      # state (LED phase, ducking, HA announce-finished, continue_conversation) syncs to playout
      # rather than decode-end (issue 14). Re-sync from upstream on any esphome bump.
      - speaker_source

  - source:
      # https://github.com/esphome/esphome/pull/12429
      type: git
      url: https://github.com/esphome/esphome
      ref: ff8ce89556748509d7ee8724e12d9d43d3c8c1e8
    refresh: 300s
    components: [http_request]
