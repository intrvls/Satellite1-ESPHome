led_ring_controller:
  id: led_controller
  user_light_id: led_ring
  pin: GPIO21
  num_leds: 24
  rgb_order: GRB
  frame_interval: 10ms
  # Amplitude-reactive ring glow during TTS replies / announcements / media (issue 13). Fed by
  # the i2s_audio_speaker on_audio_level trigger in speaker.yaml.
  enable_audio_visualizer: true

# No-op outputs backing the state-only user light. The controller does NOT drive the hardware
# through these — it reads the light's current_values (on/off, color, brightness) each frame and
# owns the WS2812 RMT channel on GPIO21 directly, rendering + transmitting on a dedicated core for
# a stable 50fps independent of the cooperative main loop.
output:
  - platform: template
    id: led_ring_r
    type: float
    write_action:
      - lambda: ""  # no-op
  - platform: template
    id: led_ring_g
    type: float
    write_action:
      - lambda: ""  # no-op
  - platform: template
    id: led_ring_b
    type: float
    write_action:
      - lambda: ""  # no-op

light:
  # User-facing LED ring. State-only: exposes on/off, color and brightness to Home Assistant.
  # The engine (led_ring_controller) reads its current_values each frame to resolve idle
  # appearance and HA on/off state.
  - platform: rgb
    id: led_ring
    name: LED Ring
    entity_category: config
    icon: "mdi:dots-circle"
    red: led_ring_r
    green: led_ring_g
    blue: led_ring_b
    default_transition_length: 0ms
    restore_mode: RESTORE_DEFAULT_OFF
    initial_state:
      color_mode: rgb
      brightness: 66%
      red: 9.4%
      green: 73.3%
      blue: 94.9%
